<svg viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg">
  <!-- Geometric D Logo -->
  <defs>
    <linearGradient id="dGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#000000;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#404040;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Outer circle -->
  <circle cx="30" cy="30" r="28" fill="none" stroke="#000000" stroke-width="2"/>

  <!-- Geometric D shape -->
  <path d="M 20 15 L 30 15 Q 40 15 40 30 Q 40 45 30 45 L 20 45 Z"
        fill="url(#dGradient)" stroke="#000000" stroke-width="1.5"/>

  <!-- Inner accent -->
  <path d="M 23 20 L 28 20 Q 36 20 36 30 Q 36 40 28 40 L 23 40 Z"
        fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.6"/>
</svg>